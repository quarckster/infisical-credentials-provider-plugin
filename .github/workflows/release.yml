name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Derive release version from tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp the plugin version from the tag
        run: >-
          mvn -B -ntp --settings .mvn/settings.xml versions:set
          -DnewVersion='${{ steps.meta.outputs.version }}'
          -DgenerateBackupPoms=false

      - name: Build and test
        run: mvn -B -ntp --settings .mvn/settings.xml clean verify

      - name: Create GitHub release and attach the .hpi
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          target/*.hpi
          --title "$GITHUB_REF_NAME"
          --generate-notes
